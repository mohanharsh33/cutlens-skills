name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run agentskills.io spec, budget, and script --help validator
        run: python scripts/validate_skills.py --strict-manifest --check-scripts

      - name: Compile-check all Python scripts
        run: python -m compileall -q scripts skills tests
